name: Nx Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Configure Git user
        run: |
          git config --global user.name "${{ steps.generate_token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build projects
        run: pnpm exec nx run-many -t build

      - name: Print Environment Info
        run: npx nx report
        shell: bash

      - name: Check built packages
        run: |
          echo "Checking built packages..."
          find packages -name "dist" -type d || echo "No dist directories found"
          ls -la packages/*/dist/ || echo "No dist contents found"
        shell: bash

      - name: Release packages (version and publish)
        run: |
          echo "Running Nx release with fallback for pnpm publishing..."

          # Run the full release process
          if npx nx release --verbose --yes; then
            echo "✅ Nx release completed successfully!"
          else
            echo "❌ Nx release failed, checking if it was due to publish step..."

            # Check if versioning succeeded but publishing failed
            if git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "🏷️ Git tag exists, versioning succeeded. Publishing manually with pnpm..."

              # Get all workspace packages and publish them
              # This will only publish if the version doesn't already exist on npm
              pnpm -r publish --access public --no-git-checks
            else
              echo "❌ No git tag found, versioning failed"
              exit 1
            fi
          fi
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
