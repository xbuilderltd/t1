name: Deployment Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: write
    steps:
      - name: Generate bot app token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Configure Git user
        run: |
          git config --global user.name "${{ steps.generate_token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.generate_token.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: npm install -g pnpm
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Build application
        run: pnpm turbo run build
      - name: Set Git user name and email
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
      - name: Generate changeset from commit message
        run: node .changeset/changesets-autogenerate.mjs
      - name: Create Pull Request for changeset
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore(changeset): autogenerate changeset'
          title: 'chore(changeset): autogenerate changeset'
          body: 'Automated changeset PR'
          branch: changeset-autogen/${{ github.run_id }}
          add-paths: .changeset/*.md
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Generate bot app token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
      - name: Configure Git user
        run: |
          git config --global user.name "${{ steps.generate_token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.generate_token.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"
      - name: Setup Node.js
        uses: actions/setup-node@v4
      - name: Enable Corepack
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Pull latest changes
        run: |
          git pull origin main
      - name: Publish to npm
        id: changesets
        uses: changesets/action@v1.4.1
        with:
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
