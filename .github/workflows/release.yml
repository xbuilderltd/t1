name: Nx Release

on:
  push:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build projects
        run: pnpm exec nx run-many -t build

      - name: Release with Nx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if this is a first release by looking for existing tags
          EXISTING_TAGS=$(git tag -l | grep -E "@pixpilot/(n1|n2)@" || true)
          if [ -z "$EXISTING_TAGS" ]; then
            echo "First release detected, running with --first-release flag"
            pnpm exec nx release --skip-publish --first-release
          else
            echo "Subsequent release, running without --first-release flag"
            pnpm exec nx release --skip-publish
          fi

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm exec nx release publish
