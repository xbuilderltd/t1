name: Nx Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Configure Git user
        run: |
          git config --global user.name "${{ steps.generate_token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.generate_token.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build projects
        run: pnpm exec nx run-many -t build

      - name: Release with Nx
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          # Check for Nx release tags for all projects
          missing_tag=false
          for pkg in packages/*/package.json; do
            name=$(jq -r .name "$pkg")
            if ! git tag | grep -q "${name}@"; then
              missing_tag=true
              break
            fi
          done
          if [ "$missing_tag" = true ]; then
            pnpm exec nx release --skip-publish --first-release
          else
            pnpm exec nx release --skip-publish
          fi

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN  }}
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          # Set provenance only for public repos
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            export NPM_CONFIG_PROVENANCE=true
          fi
          # Publish each package individually with pnpm
          for package_dir in packages/*/; do
            if [ -f "${package_dir}package.json" ]; then
              echo "Publishing package in ${package_dir}"
              cd "${package_dir}"
              pnpm publish --no-git-checks --access public
              cd - > /dev/null
            fi
          done
