name: Auto-merge Release PR

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  auto-merge:
    # Only run for PRs created by the release bot
    if: github.actor == 'pixpilot-pacakge-releaser[bot]' && startsWith(github.event.pull_request.title, 'chore')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Auto-merge release PR
        run: |
          echo "Auto-merging release PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          
          # Try to merge with retries and auto-update
          for attempt in 1 2 3 4 5; do
            echo "Merge attempt $attempt..."
            
            if gh pr merge ${{ github.event.pull_request.number }} --squash --admin; then
              echo "✅ Successfully merged PR on attempt $attempt"
              exit 0
            else
              echo "❌ Merge attempt $attempt failed"
              
              if [ $attempt -lt 5 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
                
                # Try to update the PR branch to sync with main
                echo "Attempting to update PR branch..."
                gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/update-branch \
                  --method PUT \
                  --field expected_head_sha="${{ github.event.pull_request.head.sha }}" || echo "Update branch failed, continuing..."
                
                sleep 5
              fi
            fi
          done
          
          echo "❌ Failed to merge PR after 5 attempts"
          echo "PR may need manual intervention due to conflicts or branch protection rules"
          exit 1
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Confirm merge
        run: |
          echo "✅ Successfully merged release PR #${{ github.event.pull_request.number }}"
          echo "This will trigger the release workflow to publish packages."
