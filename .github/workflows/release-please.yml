name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if triggered by release bot
        id: bot_check
        run: |
          if [[ "${{ github.actor }}" == "pixpilot-pacakge-releaser[bot]" ]] || [[ "${{ github.event.head_commit.message }}" == *"chore(main): release"* ]]; then
            echo "Bot triggered this workflow - proceeding with release"
            echo "is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "User triggered workflow - only creating release PRs"
            echo "is_bot=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup project
        if: steps.release.outputs.releases_created
        uses: ./.github/actions/setup-project
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        if: steps.release.outputs.releases_created
        run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Workflow completed
        run: |
          if [[ "${{ steps.release.outputs.prs_created }}" == "true" ]]; then
            echo "✅ Release PRs created - auto-merge workflow will handle merging"
          elif [[ "${{ steps.release.outputs.releases_created }}" == "true" ]]; then
            echo "✅ Packages released and published to NPM"
          else
            echo "✅ No releases needed at this time"
          fi
